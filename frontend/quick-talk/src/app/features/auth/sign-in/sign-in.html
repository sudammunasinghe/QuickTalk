<div class="grid min-h-screen align-items-center justify-content-center">
    <div class="col-12">
        <p-card header="Sign In" styleClass="auth-card">
            <div class="sign-in-container">
                <p>Enter your credentials to access your account</p>
                <form [formGroup]="signInForm" (ngSubmit)="onSubmit()">
                    <div class="field">
                        <label>Email Address</label>
                        <span class="p-input-icon-left">
                            <i class="pi pi-envelope"></i>
                            <input type="email" pInputText formControlName="email" placeholder="you@example.com">
                        </span>
                    </div>
                    <div class="field">
                        <label>Password</label>
                        <span class="p-input-icon-left">
                            <i class="pi pi-lock"></i>
                            <input type="password" pInputText formControlName="password" placeholder="........">
                        </span>
                    </div>
                    <div class="field-forgot-password">
                        <a routerLink="/forgot-password">
                            Forgot Password
                        </a>
                    </div>
                    <div class="field">
                        <p-button type="submit" label="Sign In"></p-button>
                    </div>
                    <div class="field-sign-up-navigation">
                        <p>
                            Don't have an account?
                            <a routerLink="/sign-up">Sign Up</a>
                        </p>
                    </div>
                </form>
            </div>
        </p-card>
    </div>
</div>
