<p-toast></p-toast>
<div class="grid min-h-screen align-items-center justify-content-center">
    <div class="col-12 sm:col-8 md:col-6 lg:col-4">
        <p-card header="Forgot Password?" styleClass="forgot-password-card">
            <div class="forgot-password-container">
                <p>No worries! Enter your email address and we'll send you a link to reset your password.</p>
                <form [formGroup]="forgotPasswordForm" (ngSubmit)="sendResetLink()">
                    <div class="forgot-password-field">
                        <label>Email Address</label>
                        <span class="p-input-icon-left">
                            <i class="pi pi-envelope"></i>
                            <input type="email" pInputText formControlName="email" placeholder="you@example.com">
                        </span>
                    </div>
                    <div class="forgot-password-field">
                        <p-button type="submit" label="Send Reset Link"></p-button>
                    </div>
                    <div class="back-to-sign-in">
                        <span class="back-to-sign-in-icon justify-content-center">
                            <i class="pi pi-arrow-left"></i>
                            <a routerLink="/sign-in">Back to Sign In</a>
                        </span>
                    </div>
                    <div class="support-section">
                        <span class="support-content">
                            <p>Need help? Contact our support team at</p>
                            <a>support@quickchat.com</a>
                        </span>
                    </div>
                </form>
            </div>
        </p-card>
    </div>
</div>
