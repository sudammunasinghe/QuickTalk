<div class="grid min-h-screen align-items-center justify-content-center">
    <div class="col-12 sm:col-8 md:col-6 lg:col-4">
        <p-card header="Reset Password" styleClass="reset-password-card">
            <div class="reset-password-container">
                <p>Enter the verification code sent to your email and create a new password.</p>
                <form [formGroup]="resetPasswordForm" (ngSubmit)="resetPassword()">
                    <div class="otp-boxes">
                        <div class="card flex flex-col items-center gap-6">
                            <p-inputotp formControlName="otpValue" [length]="6" />
                        </div>
                        <p>Enter the 6-digit code sent to your email</p>
                    </div>
                    <div class="reset-password-field">
                        <label>New Password</label>
                        <span class="p-input-icon-left">
                            <i class="pi pi-lock"></i>
                            <input type="password" pInputText formControlName="newPassword" placeholder="........">
                        </span>
                    </div>
                    <div class="reset-password-field">
                        <label>Confirm New Password</label>
                        <span class="p-input-icon-left">
                            <i class="pi pi-lock"></i>
                            <input type="password" pInputText formControlName="confirmNewPassword" placeholder="........">
                        </span>
                    </div>
                    <div class="password-requirements">
                        <p>Password Requirements:</p>
                        <ul>
                            <li>At least 8 characters</li>
                            <li>One uppercase letter</li>
                            <li>One lowercase letter</li>
                            <li>One number</li>
                        </ul>
                    </div>
                    <div class="reset-password-field">
                        <p-button type="submit" label="Reset Password"></p-button>
                    </div>
                    <div class="resend-section">
                        <span class="resend-content">
                            <p>Didn't receive the code?</p>
                            <a>Resend</a>
                        </span>
                    </div>
                    <div class="back-to-sign-in">
                        <span class="back-to-sign-in-icon justify-content-center">
                            <i class="pi pi-arrow-left"></i>
                            <a routerLink="/sign-in">Back to Sign In</a>
                        </span>
                    </div>
                </form>
            </div>
        </p-card>
    </div>
</div>
