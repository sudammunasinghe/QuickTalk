<div class="grid chat-page">
    <div class="col-3">
        <div class="sidebar-header">
            <div class="p-card">
                <app-sidebar-header></app-sidebar-header>
            </div>
        </div>
        <div class="chat-list">
            <app-chat-item *ngFor="let chatItem of chatItems" [chatItem]="chatItem"></app-chat-item>
        </div>
    </div>
    <div class="col-9">
        <div class="p-card">
            <app-chat-header [firstName]="firstName" [lastName]="lastName"></app-chat-header>
        </div>
    </div>
</div>
