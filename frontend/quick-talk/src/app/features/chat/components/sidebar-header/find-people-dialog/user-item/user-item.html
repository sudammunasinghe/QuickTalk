<div class="grid" (click)="selectedChat()">
    <div class="col-2">
        <div class="user-item-avator-conatiner">
            <ng-container *ngIf="chatItem?.profileImageUrl; else initialAvator">
                <img [src]="chatItem?.profileImageUrl" class="profile-image">
            </ng-container>

            <ng-template #initialAvator>
                <div class="user-item-avator-placeholder">
                    {{ getInitials() }}
                </div>
            </ng-template>
            <span class="user-item-online-indicator" [ngStyle]="{ backgroundColor: getStatusColor(chatItem.userId) }">
            </span>
        </div>
    </div>
    <div class="col-10 user-text">
        <div class="user-item-name">
            <h4>{{ chatItem?.firstName }} {{ chatItem?.lastName }}</h4>
        </div>
        <div class="user-item-status">
            <h5 [ngStyle]="{ color: getStatusColor(chatItem.userId) }">{{ getStatusText(chatItem.userId) }}</h5>
        </div>
    </div>
</div>
